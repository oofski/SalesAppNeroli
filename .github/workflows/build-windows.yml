name: Build Windows Installer

# Produces the Neroli Sales App Windows .exe installer on a real Windows runner
# (Build Plan §13). Every build uploads the installer as a downloadable artifact;
# pushing a version tag (v1.0.0) additionally publishes it to GitHub Releases so
# electron-updater can serve it.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a public GitHub Release with this tag (e.g. v1.0.0). Leave blank to only build the artifact.'
        required: false
        default: ''

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to publish the installer to GitHub Releases on a tag

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle (main + preload + renderer)
        run: npm run build

      - name: Build installer
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          # EV code-signing secrets (optional) — provide to sign the installer (§13.2).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neroli-Sales-App-Windows-Installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      # Publish a public GitHub Release with the installer attached — a permanent,
      # no-login, clickable download link (and the electron-updater feed). Triggered
      # by a version tag, or manually via the release_version input.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_version != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Neroli Sales App ${{ inputs.release_version || github.ref_name }}
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
          generate_release_notes: true
