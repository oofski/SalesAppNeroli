name: Build Windows Installer

# Produces the Neroli Sales App Windows .exe installer on a real Windows runner
# (Build Plan §13). Every build uploads the installer as a downloadable artifact;
# pushing a version tag (v1.0.0) additionally publishes it to GitHub Releases so
# electron-updater can serve it.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle (main + preload + renderer)
        run: npm run build

      - name: Build installer
        # Publish to GitHub Releases only on a version tag; otherwise just package.
        run: npx --no-install electron-builder --win --x64 --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # EV code-signing secrets (optional) — provide to sign the installer (§13.2).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neroli-Sales-App-Windows-Installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30
