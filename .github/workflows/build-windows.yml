name: Build Windows Installer

# Produces the Neroli Sales App Windows .exe installer on a real Windows runner
# (Build Plan §13). Every build uploads the installer as a downloadable artifact;
# pushing a version tag (v1.0.0) additionally publishes it to GitHub Releases so
# electron-updater can serve it.

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish a public GitHub Release with this tag (e.g. v1.0.0). Leave blank to only build the artifact.'
        required: false
        default: ''

concurrency:
  group: win-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required to publish the installer to GitHub Releases on a tag

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Bundle (main + preload + renderer)
        run: npm run build

      - name: Build installer
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          # EV code-signing secrets (optional) — provide to sign the installer (§13.2).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neroli-Sales-App-Windows-Installer
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 30

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Publish a public GitHub Release with the installer attached — a permanent,
      # no-login, clickable download link (and the electron-updater feed). Fires on a
      # version tag, a manual run with release_version, or a commit marked [release].
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '') || contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (github.event_name == 'workflow_dispatch' && inputs.release_version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Neroli Sales App ${{ (github.event_name == 'workflow_dispatch' && inputs.release_version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || steps.ver.outputs.tag }}
          body: |
            Neroli Sales App — Windows desktop installer.

            Download **NeroliSalesApp-Setup-1.0.0.exe** below and run it. The app is currently
            unsigned, so Windows SmartScreen may show a prompt — choose **More info → Run anyway**.
          files: |
            release/*.exe
            release/*.exe.blockmap
            release/latest.yml
          fail_on_unmatched_files: true
